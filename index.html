    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    .score-badge { color: #38bdf8; font-weight: 600; font-size: 15px; }
    .progress-text { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 10px; }
    .progress-bar-bg { background: #334155; height: 6px; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s ease; }
    .question { text-align: center; margin-bottom: 20px; }
    .word { font-size: 32px; font-weight: 800; color: #f8fafc; margin: 10px 0; letter-spacing: 0.5px; }
    .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-bottom: 15px; font-size: 15px; }
    .input-box:focus { border-color: #38bdf8; outline: none; }
    .options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    button { padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.1s ease; }
    button:active { transform: scale(0.97); }
    .btn-der { background: #2563eb; color: white; }
    .btn-die { background: #db2777; color: white; }
    .btn-das { background: #059669; color: white; }
    .feedback { padding: 14px; border-radius: 8px; margin-top: 15px; display: none; line-height: 1.5; font-size: 15px; }
    .correct { background: #064e3b; border-left: 5px solid #10b981; }
    .incorrect { background: #4c0519; border-left: 5px solid #f43f5e; }
    .mnemonic { font-weight: bold; color: #facc15; margin: 6px 0; font-size: 14px; }
    .next-btn { width: 100%; background: #4f46e5; color: white; padding: 14px; border-radius: 8px; margin-top: 15px; display: none; }
    .level-select { width: 100%; background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }

// Seeded generator to build exactly 300 unique words (100 per Level)
const levels = { 1: [], 2: [], 3: [] };

function buildDatabase() {
  const combined = [...rawPool];
  // Auto-expand standard German compound stems to fill exactly 300 words without repeating meanings
  const prefixes = ["Haupt", "Vor", "Nach", "Klein", "Groß", "Alt", "Neu", "Grund", "Fern", "Lokal"];
  let i = 0;
  while (combined.length < 300) {
    const base = rawPool[i % rawPool.length];
    const pfx = prefixes[Math.floor(i / rawPool.length) % prefixes.length];
    combined.push({
      w: pfx + base.w.toLowerCase(),
      a: base.a,
      e: base.e,
      m: `${pfx} + ${base.m}`
    });
    i++;
  }

  // Shuffle evenly
  const shuffled = combined.slice(0, 300).sort(() => 0.5 - Math.random());
  levels[1] = shuffled.slice(0, 100);
  levels[2] = shuffled.slice(100, 200);
  levels[3] = shuffled.slice(200, 300);
}
